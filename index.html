<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <title>Gulmohar</title>
  <meta name="description" content="Gulmohar — a 3D interactive botanical garden featuring a centerpiece Gulmohar tree, cascading lotus pond, tranquil gazebo, and maple grove under a real-time celestial sky." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500&display=swap">
  <style>
    /* This page is a 3D scene, not a document: a long press should orbit the
       camera rather than raise a selection loupe, and a double-tap should not
       zoom the page out from under the canvas. The flat /work and /about pages
       set none of this — there, selecting and zooming text is the point. */
    html, body {
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas { touch-action: none; -webkit-user-drag: none; }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      overflow: hidden;
      background: radial-gradient(circle at center, #3a4b60 0%, #1e2530 100%);
      font-family: 'Outfit', system-ui, sans-serif;
      cursor: crosshair;
    }

    #app { width: 100vw; height: 100dvh; touch-action: none; }

    /* --- title & permanent nav -------------------------------------------
       The dock auto-hides after a few idle seconds, so the routes to the flat
       pages also live here, where they never disappear. */
    .ui-overlay {
      position: absolute;
      top: calc(40px + env(safe-area-inset-top));
      left: calc(40px + env(safe-area-inset-left));
      color: #fff;
      z-index: 10;
      opacity: 0;
      animation: fadeInSlide 2s cubic-bezier(0.165, 0.84, 0.44, 1) forwards 0.3s;
      text-shadow: 0 8px 16px rgba(0, 0, 0, 0.6);
    }
    @keyframes fadeInSlide {
      from { opacity: 0; transform: translateY(-24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .ui-overlay h1 {
      font-size: 1.05rem;
      letter-spacing: 0.18rem;
      font-weight: 200;
      text-transform: uppercase;
      background: linear-gradient(135deg, #fff 0%, #ffd1a4 50%, #ff9a76 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .ui-overlay p { font-size: 0.82rem; letter-spacing: 0.12rem; color: #ffd1a4; opacity: 0.85; }
    .ui-overlay nav { margin-top: 14px; display: flex; gap: 18px; }
    .ui-overlay nav a {
      font-size: 0.72rem; letter-spacing: 0.16rem; text-transform: uppercase;
      color: rgba(255,255,255,0.65); text-decoration: none;
      border-bottom: 1px solid transparent; padding-bottom: 2px;
    }
    .ui-overlay nav a:hover, .ui-overlay nav a:focus-visible {
      color: #fff; border-bottom-color: #CAA565;
    }

    #clock {
      position: absolute;
      top: calc(40px + env(safe-area-inset-top));
      right: calc(40px + env(safe-area-inset-right));
      z-index: 10;
      color: rgba(255, 255, 255, 0.78);
      font-size: 0.82rem;
      letter-spacing: 0.24rem;
      font-weight: 300;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.6);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    /* --- hover label ------------------------------------------------------ */
    #hover-label {
      position: fixed;
      bottom: calc(120px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      z-index: 900;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }
    #hover-label.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
    #hover-label .hl-title {
      display: block; color: #fff; font-size: 0.95rem; font-weight: 400;
      letter-spacing: 0.14rem; text-shadow: 0 4px 14px rgba(0,0,0,0.7);
    }
    #hover-label .hl-meta {
      display: block; color: rgba(255,255,255,0.6); font-size: 0.7rem;
      letter-spacing: 0.14rem; margin-top: 3px;
    }

    /* --- dock -------------------------------------------------------------
       pointer-events: none on the bar with auto on the controls is what lets a
       drag through the gaps between buttons still orbit the camera. */
    #dock {
      position: absolute;
      bottom: calc(45px + env(safe-area-inset-bottom));
      width: 100%;
      display: flex;
      justify-content: center;
      z-index: 1000;
      pointer-events: none;
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-bar-wrapper {
      pointer-events: auto;
      background: linear-gradient(180deg,
                  rgba(255,255,255,0.15) 0%,
                  rgba(255,255,255,0.07) 45%,
                  rgba(255,255,255,0.05) 100%);
      backdrop-filter: blur(28px) saturate(200%) brightness(1.06);
      -webkit-backdrop-filter: blur(28px) saturate(200%) brightness(1.06);
      padding: 5px 11px;
      border-radius: 999px;
      border: 0.5px solid rgba(255,255,255,0.22);
      box-shadow: 0 14px 44px rgba(0,0,0,0.42), 0 2px 10px rgba(0,0,0,0.22),
                  inset 0 1px 0 rgba(255,255,255,0.34), inset 0 -1px 0 rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .glass-btn {
      background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.68);
      border: 0.5px solid rgba(255,255,255,0.10);
      border-radius: 999px;
      width: 30px; height: 30px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s ease;
      padding: 0; position: relative;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    .glass-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor;
                     stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
    .glass-btn:hover {
      background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.30);
      color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,0.28);
    }
    .glass-btn:active {
      background: rgba(255,255,255,0.24); border-color: rgba(255,255,255,0.42);
      transform: scale(0.92);
    }
    .glass-btn:focus-visible { outline: 2px solid rgba(255,255,255,0.75); outline-offset: 2px; }
    .glass-btn.day-btn { color: #ffd677; background: rgba(255,214,119,0.06); border-color: rgba(255,214,119,0.2); }
    .glass-btn.day-btn:hover { color: #fff2b2; background: rgba(255,214,119,0.16);
      border-color: rgba(255,214,119,0.45); box-shadow: 0 0 10px rgba(255,214,119,0.25); }
    .glass-btn.night-btn { color: #99d2ff; background: rgba(153,210,255,0.06); border-color: rgba(153,210,255,0.2); }
    .glass-btn.night-btn:hover { color: #d0ebff; background: rgba(153,210,255,0.16);
      border-color: rgba(153,210,255,0.45); box-shadow: 0 0 10px rgba(153,210,255,0.25); }

    .btn-tip {
      position: absolute;
      bottom: calc(100% + 12px);
      left: 50%;
      transform: translateX(-50%) translateY(4px);
      padding: 4px 10px;
      border-radius: 8px;
      background: rgba(16,20,28,0.65);
      backdrop-filter: blur(12px) saturate(160%);
      -webkit-backdrop-filter: blur(12px) saturate(160%);
      border: 1px solid rgba(255,255,255,0.14);
      color: rgba(255,255,255,0.9);
      font-size: 10px; letter-spacing: 0.12rem; white-space: nowrap;
      pointer-events: none; opacity: 0;
      transition: opacity 0.18s ease, transform 0.18s ease;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .glass-btn:hover .btn-tip,
    .glass-btn .btn-tip.tip-visible { opacity: 1; transform: translateX(-50%) translateY(0); }

    .ui-hidden { opacity: 0; transform: translateY(12px); pointer-events: none; }

    /* --- loader ----------------------------------------------------------- */
    #loader {
      position: fixed; inset: 0; z-index: 5000;
      background: #05070b;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; transition: opacity 0.9s ease;
    }
    #loader .name {
      color: #ECE7DE; font-size: 0.9rem; letter-spacing: 0.4rem;
      text-transform: uppercase; font-weight: 200;
    }
    #loader .bar { width: 120px; height: 1px; background: rgba(236,231,222,0.14); overflow: hidden; }
    #loader .bar i { display: block; height: 100%; width: 40%; background: #CAA565;
                     animation: slide 1.4s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }

    @media (max-width: 480px) {
      .glass-bar-wrapper { gap: 5px; padding: 4px 8px; }
      .glass-btn { width: 28px; height: 28px; }
      .ui-overlay { top: calc(24px + env(safe-area-inset-top)); left: calc(24px + env(safe-area-inset-left)); }
      #clock { top: calc(24px + env(safe-area-inset-top)); right: calc(24px + env(safe-area-inset-right)); }
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <div class="ui-overlay">
    <h1>Gulmohar</h1>
    <p>An interactive botanical garden</p>
    <nav>
      <a href="./work/">Work</a>
      <a href="./about/">About</a>
    </nav>
  </div>

  <div id="clock">--:--</div>

  <div id="hover-label"><span class="hl-title"></span><span class="hl-meta"></span></div>

  <div id="loader">
    <span class="name">Gulmohar</span>
    <span class="bar"><i></i></span>
  </div>

  <script type="module" src="./main.js"></script>
</body>

</html>
