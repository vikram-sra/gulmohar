<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#F6F1E3" />
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <title>Gulmohar</title>
  <meta name="description" content="Gulmohar — a 3D interactive botanical garden featuring a centerpiece Gulmohar tree, a still garden pond and a tranquil gazebo under a real-time celestial sky." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500&display=swap">
  <style>
    /* This page is a 3D scene, not a document: a long press should orbit the
       camera rather than raise a selection loupe, and a double-tap should not
       zoom the page out from under the canvas. The flat /work and /about pages
       set none of this — there, selecting and zooming text is the point. */
    html, body {
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas { touch-action: none; -webkit-user-drag: none; }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --paper: #F6F1E3; --paper-2: #EEE6D2;
      --ink: #253226;   --ink-soft: #5C6C58;
      --gulmohar: #D9502F; --pond: #5E8A86;

      /* daytime: ink on light glass */
      --hud-ink: rgba(37, 50, 38, 0.78);
      --hud-ink-strong: #253226;
      --hud-title-a: #253226;
      --hud-title-b: #D9502F;
      --hud-glass-a: rgba(255, 255, 255, 0.44);
      --hud-glass-b: rgba(255, 255, 255, 0.24);
      --hud-border: rgba(37, 50, 38, 0.16);
      --hud-shadow: 0 14px 40px rgba(37, 50, 38, 0.16), 0 2px 8px rgba(37, 50, 38, 0.10),
                    inset 0 1px 0 rgba(255, 255, 255, 0.66);
      --hud-halo: 0 1px 10px rgba(246, 241, 227, 0.9);
      --hud-halo-tight: rgba(246, 241, 227, 0.95);
      /* The caption's own plate. Much more opaque than --hud-glass-*, which
         is tuned for icons; see #hover-label for why text needs more. */
      --hl-plate-a: rgba(250, 247, 238, 0.90);
      --hl-plate-b: rgba(243, 237, 222, 0.82);
      --hl-plate-edge: rgba(37, 50, 38, 0.18);
      --hud-btn-bg: rgba(255, 255, 255, 0.30);
      --hud-btn-border: rgba(37, 50, 38, 0.12);
      --hud-tip-bg: rgba(246, 241, 227, 0.82);
      /* Warm by day, so the orb reads as lit rather than as a hole. */
      --orb-glow: rgba(217, 80, 47, 0.30);
      --orb-glow-soft: rgba(217, 80, 47, 0.14);
      /* Day and Night carry a visible ring -- they are the two buttons that
         set a state rather than run an action, so they read as a pair and
         say which one you are in. Their own tokens, because the shared
         --hud-btn-border is deliberately near-invisible and these must not
         be. */
      --btn-sun-ink: #C4441F;
      --btn-sun-line: rgba(196, 68, 31, 0.68);
      --btn-sun-bg: rgba(217, 80, 47, 0.12);
      --btn-moon-ink: #3F6F6B;
      --btn-moon-line: rgba(63, 111, 107, 0.68);
      --btn-moon-bg: rgba(94, 138, 134, 0.14);
    }

    body[data-tod="night"] {
      --hud-ink: rgba(238, 240, 246, 0.80);
      --hud-ink-strong: #EEF0F6;
      --hud-title-a: #F2E7DC;
      --hud-title-b: #F2A98C;
      --hud-glass-a: rgba(255, 255, 255, 0.14);
      --hud-glass-b: rgba(255, 255, 255, 0.06);
      --hud-border: rgba(255, 255, 255, 0.20);
      --hud-shadow: 0 14px 44px rgba(10, 14, 24, 0.44), inset 0 1px 0 rgba(255, 255, 255, 0.26);
      --hud-halo: 0 2px 12px rgba(12, 16, 26, 0.8);
      --hud-halo-tight: rgba(10, 14, 22, 0.95);
      --hl-plate-a: rgba(24, 29, 38, 0.86);
      --hl-plate-b: rgba(14, 18, 26, 0.80);
      --hl-plate-edge: rgba(255, 255, 255, 0.22);
      --hud-btn-bg: rgba(255, 255, 255, 0.06);
      --hud-btn-border: rgba(255, 255, 255, 0.13);
      --hud-tip-bg: rgba(16, 20, 28, 0.68);
      /* Cooler and a touch stronger at night, where it is the only lit thing
         on screen once the dock has collapsed into it. */
      --orb-glow: rgba(242, 169, 140, 0.34);
      --orb-glow-soft: rgba(242, 169, 140, 0.16);
      /* Both lift at night: the dark glass swallows the daytime pair, and
         the pond green in particular goes to mud against it. */
      --btn-sun-ink: #F2A98C;
      --btn-sun-line: rgba(242, 169, 140, 0.72);
      --btn-sun-bg: rgba(242, 169, 140, 0.15);
      --btn-moon-ink: #AECFE0;
      --btn-moon-line: rgba(174, 207, 224, 0.72);
      --btn-moon-bg: rgba(174, 207, 224, 0.15);
    }

    .ui-overlay, .ui-overlay *, #clock, #hover-label *,
    .glass-bar-wrapper, .glass-btn, .btn-tip {
      transition: color 0.9s ease, background 0.9s ease, border-color 0.9s ease,
                  box-shadow 0.9s ease, text-shadow 0.9s ease;
    }

    body {
      overflow: hidden;
      background: radial-gradient(circle at center, var(--paper) 0%, var(--paper-2) 100%);
      font-family: 'Outfit', system-ui, sans-serif;
      /* grab, not crosshair: the garden is something you take hold of and
         turn. JS swaps in `grabbing` while a drag is live and `pointer` over
         anything clickable. */
      cursor: grab;
    }

    #app { width: 100vw; height: 100dvh; touch-action: none; }

    /* --- title & permanent nav -------------------------------------------
       The dock auto-hides after a few idle seconds, so the routes to the flat
       pages also live here, where they never disappear. */
    .ui-overlay {
      position: absolute;
      top: calc(40px + env(safe-area-inset-top));
      left: calc(40px + env(safe-area-inset-left));
      color: #fff;
      z-index: 10;
      opacity: 0;
      animation: fadeInSlide 2s cubic-bezier(0.165, 0.84, 0.44, 1) forwards 0.3s;
      color: var(--hud-ink-strong);
      text-shadow: var(--hud-halo);
    }
    @keyframes fadeInSlide {
      from { opacity: 0; transform: translateY(-24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .ui-overlay h1 {
      font-size: 1.05rem;
      letter-spacing: 0.18rem;
      font-weight: 200;
      text-transform: uppercase;
      background: linear-gradient(135deg, var(--hud-title-a) 0%, var(--hud-title-b) 65%, var(--gulmohar) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .ui-overlay p { font-size: 0.82rem; letter-spacing: 0.12rem; color: var(--hud-title-b); opacity: 0.9; }
    .ui-overlay nav { margin-top: 14px; display: flex; gap: 18px; }
    .ui-overlay nav a {
      font-size: 0.72rem; letter-spacing: 0.16rem; text-transform: uppercase;
      color: var(--hud-ink); text-decoration: none;
      border-bottom: 1px solid transparent; padding-bottom: 2px;
    }
    .ui-overlay nav a:hover, .ui-overlay nav a:focus-visible {
      color: var(--hud-ink-strong); border-bottom-color: var(--gulmohar);
    }

    #clock {
      position: absolute;
      top: calc(40px + env(safe-area-inset-top));
      right: calc(40px + env(safe-area-inset-right));
      z-index: 10;
      color: var(--hud-ink);
      font-size: 0.82rem;
      letter-spacing: 0.24rem;
      font-weight: 300;
      font-variant-numeric: tabular-nums;
      text-shadow: var(--hud-halo);
      transition: opacity 0.6s ease, transform 0.6s ease, color 0.9s ease, text-shadow 0.9s ease;
    }

    /* --- navigation markers ----------------------------------------------
       A ring on every place worth going, so the garden says where it can be
       explored instead of making a visitor sweep the pointer around hunting
       for a cursor change. They are real buttons, which is what makes this
       work on a phone: the hitbox no longer has to be the object itself,
       which on a touchscreen meant aiming a fingertip at a distant tree.

       They scale with distance, and that is what makes them read as being IN
       the garden rather than drawn on the glass: a ring on the far banyan is
       small, the same ring on a painting an arm's length away is large.
       Clamped at both ends -- unclamped, the near case swallows the screen
       and the far case falls below a pixel and flickers.

       They hide the moment something is selected. Once you are looking at a
       painting, every other marker is an invitation to stop looking at it. */
    #nav-markers {
      position: fixed;
      inset: 0;
      z-index: 880;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.3s ease;
    }
    #nav-markers.markers-hidden { opacity: 0; pointer-events: none; }
    .nav-marker {
      position: absolute;
      left: 0; top: 0;
      transform: translate3d(var(--m-x, -999px), var(--m-y, -999px), 0) translate(-50%, -50%);
      will-change: transform;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: none;
      border: 0;
      padding: 6px;
      cursor: pointer;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
      opacity: var(--m-fade, 1);
      transition: opacity 0.2s ease;
    }
    #nav-markers.markers-hidden .nav-marker { pointer-events: none; }
    .nav-marker .nm-ring {
      display: block;
      position: relative;
      width: calc(13px * var(--m-scale, 1));
      height: calc(13px * var(--m-scale, 1));
      border-radius: 50%;
      border: 1.5px solid var(--hud-ink-strong);
      box-shadow: 0 0 0 1px var(--hud-halo-tight), 0 0 9px var(--hud-halo-tight);
      transition: transform 0.15s ease, background 0.15s ease;
    }
    /* A dot inside: at the far end of the scale the ring alone is a faint
       circle that reads as a lens artefact rather than a control. */
    .nav-marker .nm-ring::after {
      content: '';
      position: absolute;
      inset: 30%;
      border-radius: 50%;
      background: var(--hud-ink-strong);
    }
    .nav-marker:hover .nm-ring, .nav-marker:focus-visible .nm-ring {
      transform: scale(1.25);
      background: var(--hud-halo-tight);
    }
    .nav-marker .nm-name {
      font-size: calc(0.6rem * var(--m-scale, 1));
      letter-spacing: 0.1rem;
      color: var(--hud-ink-strong);
      white-space: nowrap;
      text-shadow: 0 0 4px var(--hud-halo-tight), 0 0 10px var(--hud-halo-tight);
      opacity: 0.92;
    }
    @media (prefers-reduced-motion: reduce) {
      #nav-markers, .nav-marker, .nav-marker .nm-ring { transition: none; }
    }

    /* --- hover label ------------------------------------------------------ */
    #hover-label {
      position: fixed;
      /* Just above the dock: the two belong together at the foot of the
         frame, and the wide gap left the caption stranded mid-screen. */
      bottom: calc(106px + env(safe-area-inset-bottom));
      /* Spanning the viewport and centring the plate inside it, rather than
         left:50% with a translate. With only `left` set, the element's
         containing block runs from the middle to the right edge, so its
         available width is half the viewport and max-width never got a say --
         a two-word title was wrapping at around 300px. */
      left: 0;
      right: 0;
      transform: translateY(8px);
      z-index: 900;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }
    #hover-label.visible { opacity: 1; transform: translateY(0); }

    /* The pill is back -- it was the right object; what was wrong with it was
       that it was too faint to read against lawn. So this is the dock's shape
       and language, but it does NOT borrow the dock's glass: those tokens are
       tuned for icons, which stay legible at 25% opacity because they are
       thick strokes. Text is not. This plate gets its own, far more opaque
       ground, and the ink sits at full strength on top of it. */
    #hover-label .hl-plate {
      display: inline-block;
      /* Set per frame by _trackHoverLabel, so the caption sits under the
         thing it names instead of always dead centre. Transformed rather
         than re-laid-out: this runs every frame. */
      transform: translateX(var(--hl-dx, 0px));
      padding: 8px 20px 9px;
      border-radius: 16px;
      background: linear-gradient(180deg, var(--hl-plate-a) 0%, var(--hl-plate-b) 100%);
      backdrop-filter: blur(26px) saturate(150%);
      -webkit-backdrop-filter: blur(26px) saturate(150%);
      border: 0.5px solid var(--hl-plate-edge);
      box-shadow: var(--hud-shadow);
      max-width: min(88vw, 36rem);
    }
    #hover-label .hl-title {
      display: block;
      color: var(--hud-ink-strong);
      font-size: 0.98rem;
      font-weight: 400;
      letter-spacing: 0.15rem;
      text-shadow: 0 0 3px var(--hud-halo-tight);
    }
    #hover-label .hl-meta {
      display: block;
      color: var(--hud-ink-strong);
      font-size: 0.75rem;
      font-weight: 300;
      letter-spacing: 0.15rem;
      margin-top: 4px;
      /* Was 0.86 and it was the line that lost first. The size difference
         already says which line is secondary; dimming it as well was costing
         legibility to repeat something the type was saying anyway. */
      opacity: 0.94;
      text-shadow: 0 0 3px var(--hud-halo-tight);
    }
    #hover-label .hl-meta:empty { display: none; }

    /* --- dock -------------------------------------------------------------
       pointer-events: none on the bar with auto on the controls is what lets a
       drag through the gaps between buttons still orbit the camera. */
    /* The bar and the orb are stacked in one grid cell rather than laid out
       one above the other: they are two states of the same control, so they
       share a centre and the collapse reads as the dock shrinking into the
       tree it came out of instead of sliding down past it. */
    #dock {
      position: absolute;
      bottom: calc(34px + env(safe-area-inset-bottom));
      width: 100%;
      display: grid;
      justify-items: center;
      align-items: center;
      z-index: 1000;
      pointer-events: none;
    }
    #dock > * { grid-area: 1 / 1; }
    .glass-bar-wrapper {
      pointer-events: auto;
      background: linear-gradient(180deg, var(--hud-glass-a) 0%, var(--hud-glass-b) 100%);
      backdrop-filter: blur(28px) saturate(180%) brightness(1.03);
      -webkit-backdrop-filter: blur(28px) saturate(180%) brightness(1.03);
      padding: 4px 9px;
      border-radius: 999px;
      border: 0.5px solid var(--hud-border);
      box-shadow: var(--hud-shadow), 0 0 24px var(--orb-glow-soft);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .glass-btn {
      background: var(--hud-btn-bg);
      color: var(--hud-ink);
      border: 0.5px solid var(--hud-btn-border);
      border-radius: 999px;
      width: 28px; height: 28px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s ease, background 0.9s ease, border-color 0.9s ease, color 0.9s ease;
      padding: 0; position: relative;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      /* none, not manipulation: manipulation still lets the browser read a
         touch that starts on a button as the beginning of a scroll gesture
         (the bar overflow-scrolls on narrow phones), and hands it off with a
         pointercancel instead of pointerup. none keeps every button a pure
         tap target; the bar still scrolls by a drag through the gaps. */
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    .glass-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor;
                     stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
    .glass-btn:hover {
      background: var(--hud-glass-a); border-color: var(--hud-border);
      color: var(--hud-ink-strong); box-shadow: inset 0 1px 0 rgba(255,255,255,0.28);
    }
    .glass-btn:active {
      background: var(--hud-glass-b); transform: scale(0.92);
    }
    .glass-btn:focus-visible { outline: 2px solid var(--gulmohar); outline-offset: 2px; }
    /* A full 1px, not the 0.5px hairline the other buttons wear: at 0.5px
       and 22% alpha these rings were there in the stylesheet and invisible
       on screen, which left Day and Night looking like two more unlabelled
       icons in a row of them. */
    .glass-btn.day-btn, .glass-btn.night-btn { border-width: 1px; }
    .glass-btn.day-btn {
      color: var(--btn-sun-ink);
      background: var(--btn-sun-bg);
      border-color: var(--btn-sun-line);
    }
    .glass-btn.day-btn:hover, .glass-btn.day-btn:focus-visible {
      background: rgba(217, 80, 47, 0.26);
      border-color: var(--btn-sun-ink);
      box-shadow: 0 0 12px var(--btn-sun-bg);
    }
    .glass-btn.night-btn {
      color: var(--btn-moon-ink);
      background: var(--btn-moon-bg);
      border-color: var(--btn-moon-line);
    }
    .glass-btn.night-btn:hover, .glass-btn.night-btn:focus-visible {
      background: rgba(94, 138, 134, 0.28);
      border-color: var(--btn-moon-ink);
      box-shadow: 0 0 12px var(--btn-moon-bg);
    }

    .btn-tip {
      position: absolute;
      bottom: calc(100% + 12px);
      left: 50%;
      transform: translateX(-50%) translateY(4px);
      padding: 4px 10px;
      border-radius: 8px;
      background: var(--hud-tip-bg);
      backdrop-filter: blur(12px) saturate(160%);
      -webkit-backdrop-filter: blur(12px) saturate(160%);
      border: 1px solid var(--hud-border);
      color: var(--hud-ink-strong);
      font-size: 10px; letter-spacing: 0.12rem; white-space: nowrap;
      pointer-events: none; opacity: 0;
      transition: opacity 0.18s ease, transform 0.18s ease, background 0.9s ease, color 0.9s ease;
      box-shadow: var(--hud-shadow);
    }
    .glass-btn:hover .btn-tip,
    .glass-btn .btn-tip.tip-visible { opacity: 1; transform: translateX(-50%) translateY(0); }

    .ui-hidden { opacity: 0; transform: translateY(12px); pointer-events: none; }
    /* One control in two states. The bar grows out of the orb's own footprint
       and shrinks back into it, and the orb fades up through the bar as it
       goes -- both on the same curve and duration, so the pair reads as a
       single thing expanding rather than two elements swapping. Scaled from
       the shared centre, which is the point the two states have in common. */
    .glass-bar-wrapper, #home-orb {
      transform-origin: center center;
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.44s cubic-bezier(0.16, 1, 0.3, 1),
                  background 0.9s ease, border-color 0.9s ease, color 0.9s ease;
    }
    /* Collapsed: the bar has shrunk to about the orb's width and vanished. */
    .glass-bar-wrapper.bar-collapsed {
      opacity: 0;
      transform: scale(0.16);
      pointer-events: none;
    }
    /* Expanded: the orb has swelled past the bar's edge and gone, leaving the
       bar's own tree button in its place. */
    #home-orb.orb-hidden {
      opacity: 0;
      transform: scale(2.1);
      pointer-events: none;
    }

    /* --- home orb ---------------------------------------------------------
       The one control that never hides: it is both "go back to the start"
       and the handle that brings the rest of the dock back. */
    #home-orb {
      position: relative;
      flex: none;
      pointer-events: auto;
      width: 54px; height: 54px;
      z-index: 1002;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      cursor: pointer;
      color: var(--hud-ink-strong);
      background: linear-gradient(180deg, var(--hud-glass-a) 0%, var(--hud-glass-b) 100%);
      backdrop-filter: blur(28px) saturate(180%) brightness(1.04);
      -webkit-backdrop-filter: blur(28px) saturate(180%) brightness(1.04);
      border: 0.5px solid var(--hud-border);
      box-shadow: var(--hud-shadow), 0 0 20px 2px var(--orb-glow);
      transition: box-shadow 0.5s ease, transform 0.28s cubic-bezier(0.16, 1, 0.3, 1),
                  background 0.9s ease, border-color 0.9s ease, color 0.9s ease;
      animation: orb-breathe 5s ease-in-out infinite;
      /* none, not manipulation: see .glass-btn for why. */
      touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #home-orb svg {
      width: 26px; height: 26px; fill: none; stroke: currentColor;
      stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round;
    }
    #home-orb:hover { transform: scale(1.06); }
    #home-orb:active { transform: scale(0.95); }
    @keyframes orb-breathe {
      0%, 100% { box-shadow: var(--hud-shadow), 0 0 18px 1px var(--orb-glow-soft); }
      50%      { box-shadow: var(--hud-shadow), 0 0 30px 5px var(--orb-glow); }
    }

    /* --- solid icons -------------------------------------------------------
       The dock's default icon style is a 1.35px outline, which is right for
       geometric glyphs (a square, a circle, a crescent) and wrong for
       anything organic: a stroked tree and a stroked stick figure both
       collapse into scribble at 14px. Signage solves this the same way road
       signs do -- one filled silhouette, no interior detail -- so the tree
       and the pedestrian opt into fill instead. */
    .glass-btn svg.solid-icon, #home-orb svg.solid-icon { fill: currentColor; stroke: none; }
    /* The pedestrian is the hybrid the real signal is: a filled head and
       torso mass, with limbs as thick round-capped strokes that can swing. */
    .glass-btn svg.walk-icon path, #home-orb svg.walk-icon path {
      fill: none; stroke: currentColor; stroke-width: 2.6;
      stroke-linecap: round; stroke-linejoin: round;
    }

    /* --- animated walk figure ---------------------------------------------
       A pedestrian-crossing signal, always walking. transform-box: view-box
       so transform-origin can be given in the icon's own 24x24 coordinates
       rather than the rendered box's. */
    .walk-fig > * { transform-box: view-box; }
    .walk-fig .leg-a, .walk-fig .leg-b { transform-origin: 11.4px 13.2px; }
    .walk-fig .arm-a, .walk-fig .arm-b { transform-origin: 12.1px 7.4px; }
    .walk-fig .leg-a, .walk-fig .arm-a { animation: walk-swing-a 0.9s ease-in-out infinite; }
    .walk-fig .leg-b, .walk-fig .arm-b { animation: walk-swing-b 0.9s ease-in-out infinite; }
    @keyframes walk-swing-a { 0%, 100% { transform: rotate(-15deg); } 50% { transform: rotate(15deg); } }
    @keyframes walk-swing-b { 0%, 100% { transform: rotate(15deg); } 50% { transform: rotate(-15deg); } }
    @media (prefers-reduced-motion: reduce) {
      #home-orb { animation: none; }
      .walk-fig .leg-a, .walk-fig .leg-b,
      .walk-fig .arm-a, .walk-fig .arm-b { animation: none; }
    }

    /* --- loader ----------------------------------------------------------- */
    #loader {
      position: fixed; inset: 0; z-index: 5000;
      background: var(--paper);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; transition: opacity 0.9s ease;
    }
    #loader .name {
      color: var(--ink); font-size: 0.9rem; letter-spacing: 0.4rem;
      text-transform: uppercase; font-weight: 200;
    }
    #loader .bar { width: 120px; height: 1px; background: rgba(37,50,38,0.14); overflow: hidden; }
    #loader .bar i { display: block; height: 100%; width: 40%; background: var(--gulmohar);
                     animation: slide 1.4s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }

    @media (max-width: 600px) {
      #dock {
        bottom: calc(14px + env(safe-area-inset-bottom));
        padding: 0 10px;
        width: 100vw;
      }
      #home-orb { width: 50px; height: 50px; }
      #home-orb svg { width: 24px; height: 24px; }
      #hover-label { bottom: calc(126px + env(safe-area-inset-bottom)); }
      .glass-bar-wrapper {
        gap: 4px;
        padding: 4px 8px;
        /* 9 buttons at this size (270 + 32 gaps + 16 padding = 318px) now
           fit inside a 375px-wide phone without touching the scroll edge --
           at the old 36px/6px/6px-12px this was 408px against a 355px
           available width and every phone scrolled to reach About/Instagram. */
        max-width: calc(100vw - 20px);
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .glass-bar-wrapper::-webkit-scrollbar { display: none; }
      .glass-btn {
        width: 30px;
        height: 30px;
        min-width: 30px;
        min-height: 30px;
        flex-shrink: 0;
        /* NOT manipulation -- that reintroduces exactly the scroll-hijack
           the base .glass-btn rule turns off (see its own comment), and this
           media query used to override it right back on the phones that hit
           it most. */
        touch-action: none;
      }
      .glass-btn svg { width: 15px; height: 15px; stroke-width: 1.35; }
      .ui-overlay { top: calc(18px + env(safe-area-inset-top)); left: calc(18px + env(safe-area-inset-left)); }
      #clock { top: calc(18px + env(safe-area-inset-top)); right: calc(18px + env(safe-area-inset-right)); font-size: 11px; }
      .fps-sprint-btn {
        bottom: calc(88px + env(safe-area-inset-bottom));
        right: calc(20px + env(safe-area-inset-right));
        width: 44px;
        height: 44px;
      }
    }

    /* --- FPS First-Person Navigator UI ---------------------------------- */
    .fps-touch-zone {
      position: fixed; inset: 0; pointer-events: none; z-index: 800;
    }
    .fps-joystick-base {
      position: absolute;
      /* Kept in lockstep with FPSNavigator's own _joystickRadius() (same
         formula, halved) -- that's what decides how far a drag has to travel
         before it reaches full speed, so the ring has to match it exactly or
         the visible edge and the actual limit disagree. */
      width: clamp(84px, 22vw, 120px); height: clamp(84px, 22vw, 120px);
      border-radius: 50%;
      background: var(--hud-glass-a);
      border: 1.5px solid var(--hud-border);
      box-shadow: var(--hud-shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transform: translate(-50%, -50%) scale(0.85);
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
    }
    .fps-joystick-thumb {
      position: absolute;
      top: 50%; left: 50%;
      width: 44%; height: 44%;
      border-radius: 50%;
      background: var(--hud-btn-bg);
      border: 1px solid var(--hud-border);
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.4), 0 2px 6px rgba(0,0,0,0.15);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .fps-sprint-btn, .fps-jump-btn {
      position: absolute;
      width: 42px; height: 42px;
      border-radius: 50%;
      pointer-events: auto;
      touch-action: none;
      z-index: 850;
      color: var(--hud-ink-strong);
      display: flex; align-items: center; justify-content: center;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    .fps-sprint-btn {
      bottom: calc(90px + env(safe-area-inset-bottom));
      right: calc(28px + env(safe-area-inset-right));
    }
    .fps-jump-btn {
      bottom: calc(142px + env(safe-area-inset-bottom));
      right: calc(28px + env(safe-area-inset-right));
    }
    .fps-sprint-btn.active, .fps-jump-btn:active {
      background: var(--gulmohar);
      color: #fff;
      border-color: var(--gulmohar);
      box-shadow: 0 0 16px rgba(217, 80, 47, 0.45);
    }
    .fps-walk-hint {
      position: absolute;
      top: calc(88px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 16px;
      border-radius: 999px;
      background: var(--hud-glass-a);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 0.5px solid var(--hud-border);
      box-shadow: var(--hud-shadow);
      color: var(--hud-ink-strong);
      font-size: 11px;
      letter-spacing: 0.08rem;
      pointer-events: none;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .fps-walk-hint.fps-hint-fade {
      opacity: 0;
      transform: translateX(-50%) translateY(-8px);
    }
    .fps-hint-mobile { display: none; }
    @media (pointer: coarse), (max-width: 768px) {
      .fps-hint-desktop { display: none; }
      .fps-hint-mobile { display: inline; }
    }
    .glass-btn.active-walk {
      color: var(--gulmohar);
      background: rgba(217, 80, 47, 0.15);
      border-color: var(--gulmohar);
      box-shadow: 0 0 12px rgba(217, 80, 47, 0.35);
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <div class="ui-overlay">
    <h1>Gulmohar</h1>
    <nav>
      <a href="./work/">Work</a>
      <a href="./about/">About</a>
    </nav>
  </div>

  <div id="clock">--:--</div>

  <div id="nav-markers"></div>
  <div id="hover-label"><span class="hl-plate"><span class="hl-title"></span><span class="hl-meta"></span></span></div>

  <div id="loader">
    <span class="name">Gulmohar</span>
    <span class="bar"><i></i></span>
  </div>

  <script type="module" src="./main.js"></script>
</body>

</html>
